<header>
  <span>{{ copy.brand }}</span>
  <nav [attr.aria-label]="copy.language">
    <button type="button" lang="es" [attr.aria-pressed]="language === 'es'" (click)="languageChange.emit('es')">Español</button>
    <button type="button" lang="en" [attr.aria-pressed]="language === 'en'" (click)="languageChange.emit('en')">English</button>
  </nav>
</header>
